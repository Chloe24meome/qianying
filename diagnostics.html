<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>摄像头与手势诊断</title><style>body{font:16px sans-serif;padding:40px;background:#f6f2ea;color:#493824}pre{white-space:pre-wrap}button{padding:10px;margin:8px}video{max-width:480px;display:block}</style><h1>摄像头与手势诊断</h1><p>模型检测不访问摄像头；设备检测仅检查浏览器和设备列表。点击“测试摄像头”才会请求本地视频。</p><button id="run">检测模型（自动兼容）</button><button id="fallback">检测兼容模式</button><button id="devices">检查设备环境</button><button id="camera">测试摄像头</button><pre id="result">尚未开始</pre><video id="video" autoplay muted playsinline></video><script type="module">
import {createTrackingClient} from './tracking-client.js';import {cameraFailure} from './manual.js';
const output=document.getElementById('result'),video=document.getElementById('video');let stream;
async function model(forceMain){document.getElementById('run').disabled=true;document.getElementById('fallback').disabled=true;let client;try{output.textContent='正在加载本地双手模型…';client=await createTrackingClient(m=>output.textContent=m,forceMain);const c=document.createElement('canvas');c.width=640;c.height=480;const ctx=c.getContext('2d');ctx.fillStyle='#ddd';ctx.fillRect(0,0,640,480);const frame=typeof createImageBitmap==='function'?await createImageBitmap(c):c;await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('推理超时')),15000);client.onmessage=({data})=>{clearTimeout(timer);if(data.type==='error')reject(new Error(data.message));else if(Array.isArray(data.hands)&&data.hands.length===0)resolve();else reject(new Error('空白帧返回异常'));};client.postMessage({type:'frame',frame,time:performance.now()},[frame]);});output.textContent=`PASS：${client.backend==='main'?'主线程兼容':'Worker'}双手模型初始化及空白帧推理成功。`;}catch(e){output.textContent='FAIL：'+e.message;}finally{client?.terminate();document.getElementById('run').disabled=false;document.getElementById('fallback').disabled=false;}}
document.getElementById('run').onclick=()=>model(false);document.getElementById('fallback').onclick=()=>model(true);
document.getElementById('devices').onclick=async()=>{try{const devices=await navigator.mediaDevices.enumerateDevices();output.textContent=`地址：${location.origin}\n安全上下文：${isSecureContext}\n摄像头数量：${devices.filter(d=>d.kind==='videoinput').length}（未授权前浏览器可能隐藏设备）\n浏览器：${navigator.userAgent}`;}catch(e){output.textContent=cameraFailure(e);}};
document.getElementById('camera').onclick=async()=>{if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;output.textContent='摄像头已关闭';return;}try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});video.srcObject=stream;await video.play();output.textContent=`PASS：摄像头已开启，${video.videoWidth} × ${video.videoHeight}。再次点击关闭。`;}catch(e){output.textContent=cameraFailure(e);}};
window.addEventListener('pagehide',()=>stream?.getTracks().forEach(t=>t.stop()));
</script></html>
