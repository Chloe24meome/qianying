<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五指操偶示范 · 非摄像头画面</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="acid.css"><body class="gesture-demo-page"><main>
<h1>五指提线 / 动作示范</h1><p>这是模拟手部关键点的教学示范，不是实时摄像头画面。返回剧场开启摄像头后，相同的映射与手影会跟随你的手。</p>
<span>候场</span><select id="demo-scene" hidden><option value="solo">候场</option></select><label>手掌左右移动 <input id="demo-palm" type="range" min="-20" max="20" value="0"></label><div id="finger-buttons" class="wardrobe"><button data-finger="0">拇指 / 左手</button><button data-finger="1">食指 / 左脚</button><button data-finger="2">中指 / 头部</button><button data-finger="3">无名指 / 右脚</button><button data-finger="4" aria-pressed="true">小指 / 球拍手</button></div>
<label>手指弯曲程度 <input id="demo-bend" type="range" min="0" max="100" value="85" style="max-width:300px"></label><button id="demo-auto" class="quiet">自动弯伸</button><button id="demo-pinch">捏合挥拍</button><button id="demo-jump">握拳张手跳跃</button><p id="demo-status" role="status"></p><canvas id="demo-stage" width="1200" height="780" style="width:100%;max-width:680px;display:block"></canvas><p><a href="/">← 返回候场</a></p>
</main><script type="module" src="gesture-demo.js"></script></body></html>
